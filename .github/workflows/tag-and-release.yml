name: Tag and trigger release

# Fires on every push to main, but only acts on the commit that lands
# prepare-release.yml's version-bump PR (identified by its exact commit
# subject -- squash- or rebase-merging that PR always produces this
# message, since it's the only commit on that branch). Every other push to
# main is a no-op here.
#
# Tags that commit vX.Y.Z (the baseline scripts/next-version.sh's next run
# diffs Conventional Commits from) and calls publish.yml as a job of this
# same run, gated by a single `environment: release` approval -- merging the
# bump PR is the last human decision before publish.yml actually runs.
#
# Also dispatchable by hand, with `new_tag`/`dry_run` overrides for
# validating the pipeline without a real bump PR merge.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      new_tag:
        description: "Override the vX.Y.Z tag"
        required: false
        type: string
      dry_run:
        description: "Dry Run: publish nothing"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    # head_commit is absent on workflow_dispatch, hence the event_name check first. It's also
    # the single new commit a squash/rebase merge produces; a push landing more than one new
    # commit at once (not this repo's normal PR flow) would only inspect the last of them.
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')"
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          if [ -n "${NEW_TAG:-}" ]; then
            version="${NEW_TAG#v}"
            if ! echo "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::new_tag '${NEW_TAG}' doesn't look like a vX.Y.Z tag" >&2
              exit 1
            fi
            # publish.yml re-reads Cargo.toml itself rather than taking VERSION as an input,
            # so a new_tag that disagrees with it would tag one version and publish another.
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::new_tag '${NEW_TAG}' (${version}) doesn't match Cargo.toml's workspace version (${cargo_version})" >&2
              exit 1
            fi
          else
            version="$cargo_version"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        if: inputs.dry_run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # Checked against origin, not the local clone -- checkout's shallow fetch wouldn't reliably reflect a tag pushed by an earlier attempt.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # This pipeline only ever creates lightweight tags (plain `git tag`), but a human could
          # still have pushed an annotated one by hand -- ls-remote returns the tag *object* SHA
          # for those, not the commit it points at, so peel it (^{}) before comparing to GITHUB_SHA,
          # falling back to the direct ref for the (normal) lightweight case.
          existing="$(git ls-remote origin "refs/tags/v${VERSION}^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

  approve:
    name: Approve release
    needs: tag-and-release
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - env:
          VERSION: ${{ needs.tag-and-release.outputs.version }}
        run: echo "Approved v${VERSION} for release"

  # always() is paired with an explicit success-or-skipped check, not a bare "run regardless" --
  # needed because `approve` is legitimately skipped, not failed, on a dry run.
  crates:
    name: crates.io
    needs: [tag-and-release, approve]
    if: always() && needs.tag-and-release.result == 'success' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    permissions:
      contents: read
    uses: $/.github/workflows/publish.yml
    with:
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
