name: Rust Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        # libasound2-dev: rodio (dev-dep) -> cpal -> alsa-sys needs it on Linux.
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev libasound2-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, zizmor: ignore[ref-version-mismatch] no version tags published
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install clippy-sarif sarif-fmt --locked
      - name: cargo clippy (default features, espeak-rs backend)
        # --all-features is skipped too: src/lib.rs treats espeak-rs and espeak-ng as
        # mutually exclusive and compile_errors if both are enabled.
        run: |
          set -o pipefail
          cargo clippy --workspace --lib --bins --message-format=json -- -D warnings \
            | clippy-sarif | tee clippy-results.sarif | sarif-fmt
      - name: upload clippy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: clippy-results.sarif
      - name: cargo clippy (espeak-ng backend, espeak-rs disabled)
        run: cargo clippy --lib --bins --no-default-features --features espeak-ng -- -D warnings
      - name: cargo clippy (tests and build scripts)
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, zizmor: ignore[ref-version-mismatch] no version tags published
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # No toolchain needed (licenses/bans/sources don't build); advisories are covered by audit-check above.
          command: check licenses bans sources

  # Mirrors CI.yml's `test` job exactly (kept in sync intentionally) under llvm-cov instrumentation.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang, espeak-ng, and alsa
        # Same libasound2-dev rationale as the clippy job above.
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev espeak-ng libasound2-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, zizmor: ignore[ref-version-mismatch] no version tags published
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov (dengjen-piper-rs, default features, espeak-rs backend)
        run: cargo llvm-cov --no-report -p dengjen-piper-rs
      - name: cargo llvm-cov (dengjen-espeak-rs, single-threaded)
        # espeak-ng's global voice-table state isn't thread-safe; the default parallel
        # test runner corrupts it and segfaults (SIGSEGV).
        run: cargo llvm-cov --no-report -p dengjen-espeak-rs -- --test-threads=1
      - name: cargo llvm-cov (dengjen-piper-rs, espeak-ng backend, espeak-rs disabled)
        # Same mutually-exclusive-backends constraint as the clippy job above.
        run: cargo llvm-cov --no-report -p dengjen-piper-rs --no-default-features --features espeak-ng
      - name: cargo llvm-cov (dengjen-espeak-rs-sys, build script unit tests)
        run: cargo llvm-cov --no-report -p dengjen-espeak-rs-sys --test build_script_unit_tests
      - name: cargo llvm-cov (dengjen-piper-core)
        run: cargo llvm-cov --no-report -p dengjen-piper-core
      - name: cargo llvm-cov (dengjen-stub-adapter)
        run: cargo llvm-cov --no-report -p dengjen-stub-adapter
      - name: cargo llvm-cov (dengjen-fs-voice-repo)
        run: cargo llvm-cov --no-report -p dengjen-fs-voice-repo
      - name: cargo llvm-cov (dengjen-ort-adapter)
        run: cargo llvm-cov --no-report -p dengjen-ort-adapter
      - name: cargo llvm-cov (dengjen-espeak-rs-adapter, single-threaded)
        # Same espeak-ng global-state constraint as dengjen-espeak-rs above.
        run: cargo llvm-cov --no-report -p dengjen-espeak-rs-adapter -- --test-threads=1
      - name: cargo llvm-cov report
        run: cargo llvm-cov report --cobertura --output-path cobertura.xml
      - name: upload coverage report
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: cobertura.xml
          language: Rust
          label: code-coverage/rust

  semver-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev libasound2-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: cargo semver-checks (workspace crates)
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: default-features
      - name: cargo semver-checks (dengjen-espeak-rs-sys)
        # espeak-rs-sys isn't a workspace member (see CONTRIBUTING.md), so it needs its
        # own manifest-path -- the step above never reaches it.
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          manifest-path: crates/espeak-rs-sys/Cargo.toml
          feature-group: default-features
