name: Rust Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - run: cargo install clippy-sarif sarif-fmt --locked
      - name: cargo clippy (default features, espeak-rs backend)
        # --lib --bins, not --all-targets: examples/ pulls in the `rodio` dev-dependency,
        # whose `cpal` backend needs libasound2-dev on Linux. Scoped to what actually ships.
        # --all-features is skipped too: src/lib.rs treats espeak-rs and espeak-ng as
        # mutually exclusive backends and hits a deliberate compile_error if both are on.
        run: |
          set -o pipefail
          cargo clippy --workspace --lib --bins --message-format=json -- -D warnings \
            | clippy-sarif | tee clippy-results.sarif | sarif-fmt
      - name: upload clippy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: clippy-results.sarif
      - name: cargo clippy (espeak-ng backend, espeak-rs disabled)
        run: cargo clippy --lib --bins --no-default-features --features espeak-ng -- -D warnings

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Licenses/bans/sources are cheap and don't need a full build. Advisories are also
          # covered by the separate `rustsec/audit-check` job above (kept as belt-and-braces).
          command: check licenses bans sources

  # Mirrors CI.yml's `test` job's invocations exactly, but under cargo-llvm-cov
  # instrumentation, so the Cobertura report reflects the same crates/features
  # that job actually exercises. Each `cargo test` step there becomes a
  # `--no-report` llvm-cov run so profiling data accumulates across the
  # mutually-exclusive feature combinations (espeak-rs vs espeak-ng) and the
  # single-threaded espeak-ng crates, then a final `report` step renders the
  # combined Cobertura XML.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang, espeak-ng, and alsa
        # libasound2-dev is needed by the `rodio` dev-dependency (used in tests/examples),
        # not by dengjen-piper-rs itself.
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev espeak-ng libasound2-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-llvm-cov
      - name: cargo llvm-cov (dengjen-piper-rs, default features, espeak-rs backend)
        run: cargo llvm-cov --no-report -p dengjen-piper-rs
      - name: cargo llvm-cov (dengjen-espeak-rs, single-threaded)
        # espeak-ng's global voice-table state isn't thread-safe; the default
        # parallel test runner corrupts it and segfaults (SIGSEGV). Same
        # mitigation CI.yml's test job uses for this crate.
        run: cargo llvm-cov --no-report -p dengjen-espeak-rs -- --test-threads=1
      - name: cargo llvm-cov (dengjen-piper-rs, espeak-ng backend, espeak-rs disabled)
        # src/lib.rs gates espeak-rs and espeak-ng as mutually exclusive backends,
        # so each needs its own run rather than a single --all-features build.
        run: cargo llvm-cov --no-report -p dengjen-piper-rs --no-default-features --features espeak-ng
      - name: cargo llvm-cov (dengjen-espeak-rs-sys, build script unit tests)
        run: cargo llvm-cov --no-report -p dengjen-espeak-rs-sys --test build_script_unit_tests
      - name: cargo llvm-cov (dengjen-piper-core)
        run: cargo llvm-cov --no-report -p dengjen-piper-core
      - name: cargo llvm-cov (dengjen-stub-adapter)
        run: cargo llvm-cov --no-report -p dengjen-stub-adapter
      - name: cargo llvm-cov (dengjen-fs-voice-repo)
        run: cargo llvm-cov --no-report -p dengjen-fs-voice-repo
      - name: cargo llvm-cov (dengjen-ort-adapter)
        run: cargo llvm-cov --no-report -p dengjen-ort-adapter
      - name: cargo llvm-cov (dengjen-espeak-rs-adapter, single-threaded)
        # Same espeak-ng global-state constraint as dengjen-espeak-rs above.
        run: cargo llvm-cov --no-report -p dengjen-espeak-rs-adapter -- --test-threads=1
      - name: cargo llvm-cov report
        run: cargo llvm-cov report --cobertura --output-path cobertura.xml
      - name: upload coverage report
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: cobertura.xml
          language: Rust
