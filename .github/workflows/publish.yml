name: Publish to crates.io

# Triggered automatically by tag-and-release.yml right after it tags a
# merged version-bump PR's commit vX.Y.Z (via `gh workflow run`, using the
# one event type GITHUB_TOKEN is allowed to start a new run for). Also
# dispatchable by hand -- from the Actions tab, or `gh workflow run
# publish.yml` -- which is the retry path if a partial run fails: every
# step below is idempotent (skips a crate crates.io already has), so
# re-running this from scratch after a failure is always safe, no new tag
# needed. Deliberately not tag-triggered itself: a `push: tags:` listener
# here would mean any human pushing an unrelated v*-shaped tag by mistake
# fires a real, irreversible crates.io publish.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Resolve workspace version
        # Every crate in the release train shares [workspace.package].version
        # (crates/espeak-rs-sys included -- it's not a workspace member, but
        # scripts/bump-version.sh keeps its Cargo.toml in lockstep), so it's
        # read once here rather than per crate.
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The raw espeak-ng submodule tree gzips past crates.io's 10MiB .crate
      # cap, and cargo's .crate container is hardcoded to gzip -- so the data
      # is pre-compressed with xz into bundled/espeak-ng.tar.xz (not
      # committed; see crates/espeak-rs-sys/.gitignore) and build.rs
      # decompresses it at build time. See
      # crates/espeak-rs-sys/scripts/bundle-espeak-ng.sh.
      - name: bundle espeak-ng data for publish
        run: bash crates/espeak-rs-sys/scripts/bundle-espeak-ng.sh

      # Every step below that needs the version passes it through `env:`
      # rather than interpolating `${{ steps.version.outputs.version }}`
      # directly into `run:` -- the latter is a template-expansion script
      # injection shape (flagged by zizmor/CodeQL) even though this
      # particular value only ever comes from Cargo.toml, not attacker
      # input: GitHub Actions expands `${{ }}` as literal text into the
      # script *before* the shell runs it, so anything containing shell
      # metacharacters would execute, whereas an env var is passed as a
      # real environment variable and can't reinterpret the script around it.
      #
      # Tiered by the internal dependency graph: a publish only becomes
      # resolvable to its dependent once crates.io's index (not just the
      # publish API response) has actually picked it up, hence the wait
      # step per tier. Within a tier, crates have no interdependency, so
      # they publish one after another with no wait needed in between.
      #
      # tier 1: dengjen-espeak-rs-sys, dengjen-piper-core (no internal deps)
      - name: publish tier 1 (dengjen-espeak-rs-sys)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-espeak-rs-sys "$VERSION"
      - name: publish tier 1 (dengjen-piper-core)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-piper-core "$VERSION"
      - name: wait for tier 1 to index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/wait-for-crate.sh dengjen-espeak-rs-sys "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-piper-core "$VERSION"

      # tier 2: dengjen-espeak-rs (needs espeak-rs-sys), dengjen-stub-adapter /
      # dengjen-fs-voice-repo / dengjen-ort-adapter (each needs piper-core)
      - name: publish tier 2 (dengjen-espeak-rs)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-espeak-rs "$VERSION"
      - name: publish tier 2 (dengjen-stub-adapter)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-stub-adapter "$VERSION"
      - name: publish tier 2 (dengjen-fs-voice-repo)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-fs-voice-repo "$VERSION"
      - name: publish tier 2 (dengjen-ort-adapter)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-ort-adapter "$VERSION"
      - name: wait for tier 2 to index
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/wait-for-crate.sh dengjen-espeak-rs "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-stub-adapter "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-fs-voice-repo "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-ort-adapter "$VERSION"

      # tier 3: dengjen-espeak-rs-adapter (needs piper-core + espeak-rs),
      # dengjen-piper-rs (needs espeak-rs)
      - name: publish tier 3 (dengjen-espeak-rs-adapter)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-espeak-rs-adapter "$VERSION"
      - name: publish tier 3 (dengjen-piper-rs)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-piper-rs "$VERSION"
