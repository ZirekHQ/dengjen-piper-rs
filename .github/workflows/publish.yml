name: Publish to crates.io

# Called as a job of release.yml's flow (see #105 for why the merge-triggered path has no
# approve gate). Not tag-triggered itself, so a stray tag push can't fire a real publish.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run: publish nothing"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Only gates workflow_dispatch (release.yml's merge-the-PR decision point per #105 covers
  # workflow_call). Defense-in-depth, not necessarily closing an open hole -- see the JWT
  # scoping note below on why a direct dispatch here may already fail OIDC auth on its own.
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - run: echo "approved"

  publish:
    needs: gate
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, zizmor: ignore[ref-version-mismatch] no version tags published
        with:
          toolchain: stable

      # Requires Trusted Publishing configured on crates.io for all 8 crates below. crates.io
      # matches the JWT's top-level triggering workflow, not this reusable file -- configure
      # release.yml there, not publish.yml, even though id-token: write lives here.

      # github.workflow_ref stays bound to the top-level caller even inside a called reusable
      # workflow, so it mirrors the OIDC workflow_ref claim crates.io checks (see #107). Catches
      # a future release.yml rename here instead of via crates-io-auth-action's opaque 400.
      - name: verify OIDC workflow_ref matches crates.io Trusted Publishing target
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          expected="ZirekHQ/dengjen-piper-rs/.github/workflows/release.yml"
          actual="${WORKFLOW_REF%@*}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::OIDC workflow_ref is '${actual}', expected '${expected}'. crates.io Trusted Publishing for all 8 crates targets '${expected##*/}' (see #107) -- if this workflow was renamed, update crates.io's config and this expected value together." >&2
            exit 1
          fi
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Export crates.io token
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: echo "CARGO_REGISTRY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve workspace version
        # crates/espeak-rs-sys isn't a workspace member, but scripts/bump-version.sh keeps its
        # Cargo.toml in lockstep, so the version read here covers that crate too.
        id: version
        run: |
          set -euo pipefail
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The raw espeak-ng submodule tree exceeds crates.io's 10MiB .crate cap once gzipped
      # (cargo's .crate format is hardcoded to gzip), so it's pre-compressed with xz here.
      - name: bundle espeak-ng data for publish
        run: bash crates/espeak-rs-sys/scripts/bundle-espeak-ng.sh

      # VERSION is passed via env: rather than interpolated into run: directly -- the latter is
      # a script-injection shape GitHub expands as literal text before the shell runs it (flagged
      # by zizmor/CodeQL), even though this value only ever comes from Cargo.toml.

      # tier 1: dengjen-espeak-rs-sys, dengjen-piper-core (no internal deps)
      - name: publish tier 1 (dengjen-espeak-rs-sys)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-espeak-rs-sys "$VERSION"
      - name: publish tier 1 (dengjen-piper-core)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-piper-core "$VERSION"
      - name: wait for tier 1 to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/wait-for-crate.sh dengjen-espeak-rs-sys "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-piper-core "$VERSION"

      # tier 2: dengjen-espeak-rs (needs espeak-rs-sys), dengjen-stub-adapter /
      # dengjen-fs-voice-repo / dengjen-ort-adapter (each needs piper-core)
      - name: publish tier 2 (dengjen-espeak-rs)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-espeak-rs "$VERSION"
      - name: publish tier 2 (dengjen-stub-adapter)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-stub-adapter "$VERSION"
      - name: publish tier 2 (dengjen-fs-voice-repo)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-fs-voice-repo "$VERSION"
      - name: publish tier 2 (dengjen-ort-adapter)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-ort-adapter "$VERSION"
      - name: wait for tier 2 to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/wait-for-crate.sh dengjen-espeak-rs "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-stub-adapter "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-fs-voice-repo "$VERSION"
          bash .github/scripts/wait-for-crate.sh dengjen-ort-adapter "$VERSION"

      # tier 3: dengjen-espeak-rs-adapter (needs piper-core + espeak-rs)
      - name: publish tier 3 (dengjen-espeak-rs-adapter)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-espeak-rs-adapter "$VERSION"
      - name: wait for tier 3 to index
        if: env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/wait-for-crate.sh dengjen-espeak-rs-adapter "$VERSION"

      # tier 4: dengjen-piper-rs (needs espeak-rs-adapter)
      - name: publish tier 4 (dengjen-piper-rs)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/publish-crate-if-needed.sh dengjen-piper-rs "$VERSION"
