name: Prepare release

# Proposes a release; merging the opened PR is what actually cuts one -- release.yml tags that
# merge commit and triggers every downstream release workflow automatically.
on:
  workflow_dispatch:

permissions: {}

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require a maintainer on main
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error::Releases are prepared from main, not $REF"
            exit 1
          fi
          role=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .role_name)
          case "$role" in
            admin|maintain) echo "$ACTOR has role $role" ;;
            *) echo "::error::$ACTOR has role '$role'; preparing a release needs admin or maintain"; exit 1 ;;
          esac

  prepare:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, zizmor: ignore[ref-version-mismatch] no version tags published
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          # Only exit 1 means "nothing release-worthy" -- any other nonzero is next-version.sh being
          # broken and must fail loudly, or a bad tag state would silently suppress every release.
          version="$(bash scripts/next-version.sh)"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi

      - name: Bump version
        if: steps.next.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: bash scripts/bump-version.sh "$VERSION"

      - name: Open release PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml
          git commit -m "chore: bump workspace version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: bump workspace version -> ${VERSION}" \
            --body "Computed by \`prepare-release.yml\` from Conventional Commit subjects since the last tag (see \`scripts/next-version.sh\`). **Merging this releases v${VERSION}**: \`release.yml\` tags this merge commit \`v${VERSION}\` and triggers \`publish-crates.yml\` automatically, publishing all 8 crates to crates.io. Review the version and the diff before merging -- there's no further manual gate after this." \
            --base main --head "$branch"
