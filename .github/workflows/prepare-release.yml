name: Prepare release

# Manual trigger only -- merging the opened PR is the one remaining gate: tag-and-release.yml
# then tags and publishes automatically, no further steps.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        # bump-version.sh's cargo check builds espeak-rs-sys's build.rs, which needs libclang.
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
          submodules: recursive
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, zizmor: ignore[ref-version-mismatch] no version tags published
        with:
          toolchain: stable

      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          # Only exit 1 means "nothing release-worthy" -- any other nonzero is next-version.sh being
          # broken and must fail loudly, or a bad tag state would silently suppress every release.
          version="$(bash scripts/next-version.sh)"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi

      - name: Bump version
        if: steps.next.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: bash scripts/bump-version.sh "$VERSION"

      - name: Open release PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml
          git commit -m "chore: bump workspace version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: bump workspace version -> ${VERSION}" \
            --body "Computed by \`prepare-release.yml\` from Conventional Commit subjects since the last tag (see \`scripts/next-version.sh\`). **Merging this releases v${VERSION}**: \`tag-and-release.yml\` tags this merge commit \`v${VERSION}\` and triggers \`publish.yml\` automatically, publishing all 8 crates to crates.io. Review the version and the diff before merging -- there's no further manual gate after this." \
            --base main --head "$branch"
