name: Prepare release

# Proposes a release; merging the opened PR is what actually cuts one -- release.yml tags that
# merge commit and triggers every downstream release workflow automatically.
on:
  workflow_dispatch:
    inputs:
      new_tag:
        description: "Skip the PR: release this exact vX.Y.Z tag directly (requires approval)"
        required: false
        type: string
      dry_run:
        description: "Dry Run: publish nothing (only used together with new_tag)"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  # Normal path: compute the next version and open the PR. Merging it is the release gate --
  # nothing here needs approval of its own. Skipped when new_tag selects the override path below.
  prepare:
    if: inputs.new_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install build dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          submodules: recursive
          persist-credentials: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, zizmor: ignore[ref-version-mismatch] no version tags published
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Compute next version
        id: next
        run: |
          set -uo pipefail
          # Only exit 1 means "nothing release-worthy" -- any other nonzero is next-version.sh being
          # broken and must fail loudly, or a bad tag state would silently suppress every release.
          version="$(bash scripts/next-version.sh)"
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [ "$rc" -eq 1 ]; then
            echo "::notice::Nothing release-worthy since the last tag -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::scripts/next-version.sh failed (exit ${rc})"
            exit "$rc"
          fi

      - name: Bump version
        if: steps.next.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: bash scripts/bump-version.sh "$VERSION"

      - name: Open release PR
        if: steps.next.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          branch="chore/bump-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock crates/*/Cargo.toml
          git commit -m "chore: bump workspace version -> ${VERSION}"
          git push -u origin "$branch"
          gh pr create --title "chore: bump workspace version -> ${VERSION}" \
            --body "Computed by \`prepare-release.yml\` from Conventional Commit subjects since the last tag (see \`scripts/next-version.sh\`). **Merging this releases v${VERSION}**: \`release.yml\` tags this merge commit \`v${VERSION}\` and triggers \`publish-crates.yml\` automatically, publishing all 8 crates to crates.io. Review the version and the diff before merging -- there's no further manual gate after this." \
            --base main --head "$branch"

  # Override path: skip prepare/PR entirely and hand off straight to release.yml. This is
  # the one path in the whole pipeline with no PR review to fall back on, so it's the only
  # thing that still needs a human gate.
  gate:
    if: inputs.new_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - run: echo "approved"

  release-now:
    needs: gate
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      new_tag: ${{ inputs.new_tag }}
      dry_run: ${{ inputs.dry_run == true }}
