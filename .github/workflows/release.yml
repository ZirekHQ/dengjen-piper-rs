name: Release

# No trigger or gate of its own -- prepare-release.yml is the single entry point (its `prepare`
# job for the PR-merge path, `gate`+`release-now` for the override path). Reacts to that PR's
# merge landing on main (push) or the override path's direct call (workflow_call).
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      new_tag:
        required: false
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    # github.event_name inherits the top-level caller's event through nested workflow_call hops,
    # not literally 'workflow_call' -- inputs.new_tag != '' detects the override path directly.
    if: >-
      inputs.new_tag != '' ||
      startsWith(github.event.head_commit.message, 'chore: bump workspace version -> ')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true

      - name: Resolve workspace version
        id: version
        env:
          NEW_TAG: ${{ inputs.new_tag }}
        run: |
          set -euo pipefail
          cargo_version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version = /{gsub(/version = "|"/,""); print; exit}' Cargo.toml)"
          if [ -n "${NEW_TAG:-}" ]; then
            version="${NEW_TAG#v}"
            if ! echo "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "::error::new_tag '${NEW_TAG}' doesn't look like a vX.Y.Z tag" >&2
              exit 1
            fi
            if [ "$version" != "$cargo_version" ]; then
              echo "::error::new_tag '${NEW_TAG}' (${version}) doesn't match Cargo.toml's workspace version (${cargo_version})" >&2
              exit 1
            fi
          else
            version="$cargo_version"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # ls-remote returns an annotated tag's tag-object SHA, not the commit -- peel via ^{}
        # first, falling back to the direct ref for this pipeline's normal lightweight tags.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${GITHUB_SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

  crates:
    name: crates.io
    needs: tag-and-release
    if: always() && needs.tag-and-release.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-crates.yml # zizmor: ignore[self-repository] CI is pinned to zizmor v1.28.0, which predates $/ syntax support
    with:
      dry_run: ${{ inputs.dry_run == true }}
