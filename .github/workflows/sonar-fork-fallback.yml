name: Sonar fork fallback

# sonar.yml skips Sonar for fork PRs (no SONAR_TOKEN), but that check is required on main --
# a required check that never reports leaves fork PRs stuck, so this workflow posts it itself.

# pull_request_target (write access + base-repo secrets) is required to post a status on a
# fork PR -- this workflow must never check out or execute anything from the PR itself.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    branches: [ main ]

concurrency:
  group: sonar-fork-fallback-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  neutral_status:
    name: Sonar fork fallback
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    # Same-repo PRs get a real analysis; never overwrite it.
    if: github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Report the Sonar check as skipped
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method POST "repos/${REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context='SonarCloud Code Analysis' \
            -f description='Skipped for fork PR: SONAR_TOKEN is unavailable' \
            -f target_url="${RUN_URL}"
