name: Sonar

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

# SonarCloud keeps whichever scan finishes last, not the newest commit, so overlapping scans can strand main on stale analysis.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Fork PRs get no repository secrets, so SONAR_TOKEN would be empty and the scan would fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar needs full history for new-code detection and blame
          persist-credentials: false
      - name: SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
