name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang, espeak-ng, and alsa
        # libasound2-dev is needed by the `rodio` dev-dependency (used in tests/examples),
        # not by dengjen-piper-rs itself.
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev espeak-ng libasound2-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: cargo test (dengjen-piper-rs, default features, espeak-rs backend)
        run: cargo test -p dengjen-piper-rs
      - name: cargo test (dengjen-espeak-rs, single-threaded)
        # espeak-ng's global voice-table state isn't thread-safe; the default
        # parallel test runner corrupts it and segfaults (SIGSEGV). Same
        # mitigation dengjen-tts uses for its espeak-ng-backed crates.
        run: cargo test -p dengjen-espeak-rs -- --test-threads=1
      - name: cargo test (dengjen-piper-rs, espeak-ng backend, espeak-rs disabled)
        # src/lib.rs gates espeak-rs and espeak-ng as mutually exclusive backends,
        # so each needs its own run rather than a single --all-features build.
        run: cargo test -p dengjen-piper-rs --no-default-features --features espeak-ng
      - name: cargo test (dengjen-espeak-rs-sys, build script unit tests)
        # build.rs's own #[cfg(test)] module is registered as a `[[test]]` target
        # in Cargo.toml (Cargo never tests a build script otherwise); run it
        # explicitly since `-p dengjen-espeak-rs-sys` isn't exercised by any other step.
        run: cargo test -p dengjen-espeak-rs-sys --test build_script_unit_tests
      - name: cargo test (dengjen-piper-core)
        run: cargo test -p dengjen-piper-core
      - name: cargo test (dengjen-stub-adapter)
        run: cargo test -p dengjen-stub-adapter
      - name: cargo test (dengjen-fs-voice-repo)
        run: cargo test -p dengjen-fs-voice-repo
      - name: cargo test (dengjen-ort-adapter)
        run: cargo test -p dengjen-ort-adapter
      - name: cargo test (dengjen-espeak-rs-adapter, single-threaded)
        # Same espeak-ng global-state constraint as dengjen-espeak-rs above:
        # this adapter drives the same non-thread-safe voice-table state.
        run: cargo test -p dengjen-espeak-rs-adapter -- --test-threads=1
      - name: check ru_listx dictionary is packaged (#23)
        run: bash .github/scripts/check-ru-listx-packaged.sh

  lint:
    name: clippy (piper-core and Phase 2 adapters)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang, espeak-ng, and alsa
        # libasound2-dev is needed by the `rodio` dev-dependency (used in tests/examples),
        # not by dengjen-piper-rs itself.
        run: sudo apt-get update && sudo apt-get install -y llvm llvm-dev llvm-runtime libclang-dev espeak-ng libasound2-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: cargo clippy (piper-core and Phase 2 adapters, deny warnings)
        run: |
          cargo clippy -p dengjen-piper-core --all-targets -- -D warnings
          cargo clippy -p dengjen-stub-adapter --all-targets -- -D warnings
          cargo clippy -p dengjen-fs-voice-repo --all-targets -- -D warnings
          cargo clippy -p dengjen-ort-adapter --all-targets -- -D warnings
          cargo clippy -p dengjen-espeak-rs-adapter --all-targets -- -D warnings

  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Cross-compiling for Android has no unit tests of its own (it's a build
  # script exercising CMake + the NDK toolchain), so an actual cross-build
  # is the regression test for it. See issue #9.
  android:
    name: cross-compile (aarch64-linux-android)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang (for bindgen)
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: cargo build (dengjen-espeak-rs-sys, aarch64-linux-android)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        run: cargo build -p dengjen-espeak-rs-sys --target aarch64-linux-android

  # Cross-compiling for Linux arm64 (e.g. Raspberry Pi) needs no toolchain
  # file or sysroot of its own: the `cmake`/`cc` crates already recognize the
  # standard `aarch64-linux-gnu-*` cross-compiler naming convention that
  # `crossbuild-essential-arm64` installs, unlike the Android NDK (see the
  # `android` job above and issue #9). A plain cross-build is still the
  # regression test for it, same reasoning as that job. See issue #16.
  linux-arm64:
    name: cross-compile (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: git-submodule-fix
        run: git config --global protocol.file.allow always
      - name: install libclang (for bindgen) and the arm64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev llvm-dev crossbuild-essential-arm64 pkg-config libssl-dev
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: cargo build (dengjen-piper-rs, aarch64-unknown-linux-gnu)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p dengjen-piper-rs --target aarch64-unknown-linux-gnu
