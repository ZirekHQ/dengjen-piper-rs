[package]
name = "dengjen-stub-adapter"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "Deterministic, dependency-free Phonemizer test double for dengjen-piper-rs"
repository = "https://github.com/ZirekHQ/dengjen-piper-rs"
edition = "2024"

[dependencies]
piper-core = { path = "../piper-core", package = "dengjen-piper-core" }

[dev-dependencies]
piper-core = { path = "../piper-core", package = "dengjen-piper-core", features = ["testing"] }
