[workspace]
members = ["crates/espeak-rs", "crates/piper-core", "crates/stub-adapter", "crates/fs-voice-repo"]
resolver = "1"

[package]
name = "dengjen-piper-rs"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Use piper TTS models in Rust"
repository = "https://github.com/ZirekHQ/dengjen-piper-rs"

[dependencies]
espeak-rs = { path = "crates/espeak-rs", package = "dengjen-espeak-rs", version = "0.2.0", default-features = false, optional = true }
ndarray = "0.16.1"
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"
ort = { version = "=2.0.0-rc.12" }
espeak-ng = { version = "0.1.3", optional = true }
unicode-normalization = "0.1"

[dev-dependencies]
rodio = "0.22"

[features]
default = ["espeak-rs", "compile-espeak-intonations"]
espeak-rs = ["dep:espeak-rs"]
espeak-ng = ["dep:espeak-ng"]
compile-espeak-intonations = ["espeak-rs/compile-espeak-intonations"]
