[workspace]
members = ["crates/espeak-rs", "crates/piper-core", "crates/stub-adapter", "crates/fs-voice-repo", "crates/ort-adapter", "crates/espeak-rs-adapter"]
resolver = "2"

[workspace.package]
version = "0.2.6"
rust-version = "1.88"

[package]
name = "dengjen-piper-rs"
version.workspace = true
rust-version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "Use piper TTS models in Rust"
repository = "https://github.com/ZirekHQ/dengjen-piper-rs"

[dependencies]
piper-core = { path = "crates/piper-core", package = "dengjen-piper-core", version = "0.2.6" }
ort-adapter = { path = "crates/ort-adapter", package = "dengjen-ort-adapter", version = "0.2.6" }
espeak-rs-adapter = { path = "crates/espeak-rs-adapter", package = "dengjen-espeak-rs-adapter", version = "0.2.6", optional = true }
serde = { version = "1.0.160", features = ["derive"] }
serde_json = "1.0.89"
ort = { version = "=2.0.0-rc.12" }
espeak-ng = { version = "0.1.3", optional = true }
unicode-normalization = "0.1"

[dev-dependencies]
rodio = "0.22"
fs-voice-repo = { path = "crates/fs-voice-repo", package = "dengjen-fs-voice-repo" }
stub-adapter = { path = "crates/stub-adapter", package = "dengjen-stub-adapter" }
espeak-rs = { path = "crates/espeak-rs", package = "dengjen-espeak-rs", default-features = false }
tempfile = "3.13"
divan = "0.1.2"

[features]
default = ["espeak-rs", "compile-espeak-intonations"]
espeak-rs = ["dep:espeak-rs-adapter"]
espeak-ng = ["dep:espeak-ng"]
compile-espeak-intonations = ["espeak-rs-adapter?/compile-espeak-intonations"]

[[example]]
name = "hexagonal_pipeline"
required-features = ["espeak-rs"]

[[bench]]
name = "synthesis"
harness = false
required-features = ["espeak-rs"]
