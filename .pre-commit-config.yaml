repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-yaml

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      - id: cargo-check
      - id: clippy
        # Matches .github/workflows/rust-lint.yml's clippy job: --lib --bins (not
        # --all-targets) to skip the `rodio` dev-dependency's alsa requirement, and no
        # --all-features since espeak-rs/espeak-ng are mutually exclusive backends.
        args: ["--workspace", "--lib", "--bins", "--", "-D", "warnings"]
